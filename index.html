<html lang="zh-CN">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lunesnow 的前端作品集与简历站，展示 Vue / TypeScript 项目与学习轨迹。" />
    <meta name="theme-color" content="#0F0F10" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FAFAF8" media="(prefers-color-scheme: light)" />

    <title>Lunesnow | 前端开发工程师</title>
    <script>
      // Prevent dark-mode flash — must run before <body> paints
      ;(function () {
        try {
          var t = localStorage.getItem('theme')
          if (t !== 'light') {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
          /* localStorage disabled */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
